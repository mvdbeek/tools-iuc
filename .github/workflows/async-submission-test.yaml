name: Async submission batch test
on:
  workflow_dispatch:
env:
  GALAXY_FORK: mvdbeek
  GALAXY_BRANCH: async-submission-parse-fix
  MAX_CHUNKS: 40
  CUSTOM_PLANEMO_VERSION: "git+https://github.com/mvdbeek/planemo.git@async-submission"
jobs:
  setup:
    name: Setup cache and determine changed repositories
    runs-on: ubuntu-latest
    outputs:
      galaxy-head-sha: ${{ steps.get-galaxy-sha.outputs.galaxy-head-sha }}
      repository-list: ${{ steps.set-failing-repos.outputs.repository-list }}
      chunk-count: ${{ steps.set-failing-repos.outputs.chunk-count }}
      chunk-list: ${{ steps.set-failing-repos.outputs.chunk-list }}
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
    - name: Determine latest commit in the Galaxy repo
      id: get-galaxy-sha
      run: echo "galaxy-head-sha=$(git ls-remote https://github.com/${{ env.GALAXY_FORK }}/galaxy refs/heads/${{ env.GALAXY_BRANCH }} | cut -f1)" >> $GITHUB_OUTPUT
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v5
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ steps.get-galaxy-sha.outputs.galaxy-head-sha }}
    - name: Install wheel
      run: pip install wheel
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Fake a Planemo run to update cache and determine repositories and chunks
      uses: galaxyproject/planemo-ci-action@v1
      id: discover
      with:
        create-cache: ${{ steps.cache-pip.outputs.cache-hit != 'true' }}
        planemo-version: ${{ env.CUSTOM_PLANEMO_VERSION }}
        galaxy-fork: ${{ env.GALAXY_FORK }}
        galaxy-branch: ${{ env.GALAXY_BRANCH }}
        max-chunks: ${{ env.MAX_CHUNKS }}
        python-version: ${{ matrix.python-version }}
    - name: Set failing repository list
      id: set-failing-repos
      run: |
        repos=(
          data_managers/data_manager_bmtagger_index_builder/data_manager/bmtagger.xml
          data_managers/data_manager_bowtie2_index_builder/data_manager/bowtie2_index_builder.xml
          data_managers/data_manager_bowtie_index_builder/data_manager/bowtie_index_builder.xml
          data_managers/data_manager_build_coreprofiler/data_manager/data_manager_build_coreprofiler_download.xml
          data_managers/data_manager_build_staramr/data_manager/data_manager_build_staramr_download.xml
          data_managers/data_manager_bwa_mem2_index_builder/data_manager/bwa_mem2_index_builder.xml
          data_managers/data_manager_bwa_mem_index_builder/data_manager/bwa_mem_index_builder.xml
          data_managers/data_manager_bwameth_index_builder/data_manager/bwameth_index_builder.xml
          data_managers/data_manager_fetch_genome_dbkeys_all_fasta/data_manager/data_manager_fetch_genome_all_fasta_dbkeys.xml
          data_managers/data_manager_fetch_plasmidfinder/data_manager/plasmidfinder_fetch_database.xml
          data_managers/data_manager_fetch_refseq/data_manager/fetch_refseq.xml
          data_managers/data_manager_hisat2_index_builder/data_manager/hisat2_index_builder.xml
          data_managers/data_manager_homer_preparsed/data_manager/homer_genome_preparse.xml
          data_managers/data_manager_homer_preparsed/data_manager/homer_install_promoters.xml
          data_managers/data_manager_liana_resources/data_manager/liana_resources_manager.xml
          data_managers/data_manager_mash_sketch_builder/data_manager/mash_sketch_builder.xml
          data_managers/data_manager_mitos/data_manager/data_manager_mitos.xml
          data_managers/data_manager_mmseqs2_database/data_manager/data_manager_mmseqs2_download.xml
          data_managers/data_manager_mothur_toolsuite/data_manager/data_manager_fetch_mothur_reference_data.xml
          data_managers/data_manager_pharokka_database_fetcher/data_manager/pharokka_db_fetcher.xml
          data_managers/data_manager_primer_scheme_bedfiles/data_manager/install_primer_scheme_bedfiles.xml
          data_managers/data_manager_salmon_index_builder/data_manager/salmon_index_builder.xml
          data_managers/data_manager_selection_background/data_manager/data_manager_selection_background.xml
          data_managers/data_manager_snpsift_dbnsfp/data_manager/data_manager_snpsift_dbnsfp.xml
          data_managers/data_manager_star_index_builder/data_manager/rna_star_index_builder.xml
          data_managers/data_manager_twobit_builder/data_manager/twobit_builder.xml
          tools/allegro/allegro.xml
          tools/amrfinderplus/amrfinderplus.xml
          tools/arriba/arriba.xml
          tools/arriba/arriba_draw_fusions.xml
          tools/autobigs/autobigs-cli.xml
          tools/bigscape/bigscape.xml
          tools/biscot/biscot.xml
          tools/bwameth/bwameth.xml
          tools/cat/cat_bins.xml
          tools/chewbbaca/AlleleCallEvaluator.xml
          tools/cialign/cialign.xml
          tools/cnvkit/batch.xml
          tools/coreprofiler/coreprofiler_allele_calling.xml
          tools/craq/craq.xml
          tools/deseq2/deseq2.xml
          tools/dropletutils/dropletutils.xml
          tools/episcanpy/cluster_embed.xml
          tools/fairy/fairy_cov.xml
          tools/freebayes/freebayes.xml
          tools/gatk4/gatk4_Mutect2.xml
          tools/gemini/gemini_query.xml
          tools/genrich/genrich.xml
          tools/gprofiler/gprofiler_convert.xml
          tools/gprofiler/gprofiler_gost.xml
          tools/gprofiler/gprofiler_orth.xml
          tools/gprofiler/gprofiler_snpense.xml
          tools/gubbins/gubbins.xml
          tools/gwtc_analysis/gwtc_analysis.xml
          tools/hisat2/hisat2.xml
          tools/hmmer3/hmmsearch.xml
          tools/hmmer3/nhmmer.xml
          tools/homer/homer_findMotifsGenome.xml
          tools/humann/humann.xml
          tools/hybpiper/hybpiper.xml
          tools/macs2/macs2_randsample.xml
          tools/maker/maker.xml
          tools/map_param_value/map_param_value.xml
          tools/meme/meme.xml
          tools/meningotype/meningotype.xml
          tools/merquryfk/merquryfk.xml
          tools/metawrapmg/metawrapmg_binning.xml
          tools/migmap/migmap.xml
          tools/miniprot/miniprot.xml
          tools/mlst/mlst.xml
          tools/mothur/sens.spec.xml
          tools/multigsea/multigsea.xml
          tools/ncbi_entrez_direct/esearch.xml
          tools/ncbi_entrez_eutils/elink.xml
          tools/novoplasty/novoplasty.xml
          tools/pairtools/parse.xml
          tools/picrust2/hsp.xml
          tools/picrust2/pathway_pipeline.xml
          tools/picrust2/place_seqs.xml
          tools/pirate/pirate.xml
          tools/pygenometracks/pyGenomeTracks.xml
          tools/quast/quast.xml
          tools/repeatmodeler/repeatmodeler.xml
          tools/rgrnastar/rg_rnaStarSolo.xml
          tools/seaborn/seaborn_pairgrid.xml
          tools/seurat/inspect_and_manipulate.xml
          tools/smallgenomeutilities/frameshift_deletions_checks.xml
          tools/snapatac2/dimension_reduction_clustering.xml
          tools/snapatac2/peaks_and_motif_analysis.xml
          tools/spapros/selection.xml
          tools/spatialdata/spatialdata_io.xml
          tools/stacks2/stacks_tsv2bam.xml
          tools/table_compute/table_compute.xml
          tools/telescope/telescope_assign.xml
          tools/varvamp/varvamp.xml
        )
        printf "%s\n" "${repos[@]}" > repo_list.txt
        echo "repository-list<<EOF" >> $GITHUB_OUTPUT
        cat repo_list.txt >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
        count=${#repos[@]}
        max=${{ env.MAX_CHUNKS }}
        chunk_count=$(( count < max ? count : max ))
        echo "chunk-count=$chunk_count" >> $GITHUB_OUTPUT
        chunk_list=$(python3 -c "import json; print(json.dumps(list(range($chunk_count))))")
        echo "chunk-list=$chunk_list" >> $GITHUB_OUTPUT
    - name: Show repository list
      run: cat repo_list.txt
    - name: Show chunks
      run: |
        echo 'Using ${{ steps.set-failing-repos.outputs.chunk-count }} chunks (${{ steps.set-failing-repos.outputs.chunk-list }})'

  test:
    name: Test tools
    runs-on: ubuntu-latest
    needs: setup
    if: ${{ needs.setup.outputs.repository-list != '' }}
    strategy:
      fail-fast: false
      matrix:
        chunk: ${{ fromJson(needs.setup.outputs.chunk-list) }}
        python-version: ['3.11']
    services:
      postgres:
        image: postgres:11
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v5
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Get number of CPU cores
      uses: SimenB/github-actions-cpu-cores@v3
      id: cpu-cores
    - name: Clean dotnet folder for space
      run: rm -Rf /usr/share/dotnet
    - name: Planemo test
      uses: galaxyproject/planemo-ci-action@v1
      id: test
      with:
        mode: test
        planemo-version: ${{ env.CUSTOM_PLANEMO_VERSION }}
        repository-list: ${{ needs.setup.outputs.repository-list }}
        galaxy-fork: ${{ env.GALAXY_FORK }}
        galaxy-branch: ${{ env.GALAXY_BRANCH }}
        chunk: ${{ matrix.chunk }}
        chunk-count: ${{ needs.setup.outputs.chunk-count }}
        galaxy-slots: ${{ steps.cpu-cores.outputs.count }}
        test_timeout: 900
        additional-planemo-options: "--biocontainers"
    - uses: actions/upload-artifact@v7
      with:
        name: 'Tool test output ${{ matrix.chunk }}'
        path: upload

  combine_outputs:
    name: Combine chunked test results
    needs: [setup, test]
    if: ${{ always() && needs.setup.outputs.repository-list != '' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11']
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Cache .cache/pip
      uses: actions/cache@v5
      id: cache-pip
      with:
        path: ~/.cache/pip
        key: pip_cache_py_${{ matrix.python-version }}_gxy_${{ needs.setup.outputs.galaxy-head-sha }}
    - name: Combine outputs
      uses: galaxyproject/planemo-ci-action@v1
      id: combine
      with:
        mode: combine
        html-report: true
        markdown-report: true
    - uses: actions/upload-artifact@v7
      with:
        name: 'All tool test results'
        path: upload
    - run: cat upload/tool_test_output.md >> $GITHUB_STEP_SUMMARY
    - name: Check outputs
      uses: galaxyproject/planemo-ci-action@v1
      id: check
      with:
        mode: check
